name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils qpdf tesseract-ocr
      - run: make bootstrap
      - run: make check
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then ver="0.0.0-dev"; fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/filings-library:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/filings-library:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
      - name: Smoke linux/amd64
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/filings-library@${DIGEST}"
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /data:uid=1001,gid=1001,mode=0700 \
            --tmpfs /tmp "$IMAGE" --help >/dev/null
          echo "Published: $IMAGE"
      - name: Record digest
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > digests/filings-library
      - name: Upload digest
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: digest-filings-library
          path: digests/filings-library

  publish-release:
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: digest-filings-library
          path: digests
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          digest="$(cat digests/filings-library)"
          version="${GITHUB_REF_NAME#v}"
          notes="$(printf 'Multi-arch container image (linux/amd64, linux/arm64):\n\n- `ghcr.io/%s/filings-library:%s@%s`\n' \
            "${GITHUB_REPOSITORY_OWNER}" "$version" "$digest")"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
