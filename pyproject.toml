[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "filings-library"
version = "0.5.2"
description = "Multi-user company financial filings library: immutable archive, OCR, Markdown, FTS5 search, XBRL facts, and MCP server"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "benjamin-di"}]
dependencies = [
    "pydantic>=2.11,<3",
    "httpx>=0.28,<1",
    "fastmcp==4.1.3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<6",
    "openpyxl>=3.1,<4",
    "starlette>=1.0,<2",
    "uvicorn>=0.30,<1",
    "signin-window[oidc]==0.15.0",
    "issuer-sources @ https://github.com/benjamin-di/issuer-sources/archive/refs/tags/v0.2.0.tar.gz",
]

[project.optional-dependencies]
extractor = [
    "pypdfium2>=4.30,<6",
    "pillow>=11,<13",
    "python-pptx>=1.0,<2",
]

[project.scripts]
filings-library = "filings_library.cli:main"

[project.urls]
Homepage = "https://github.com/benjamin-di/filings-library"
Repository = "https://github.com/benjamin-di/filings-library"
Issues = "https://github.com/benjamin-di/filings-library/issues"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25",
    "ruff>=0.12,<1",
    "mypy>=1.18,<2",
    "types-beautifulsoup4",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/filings_library"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: requires public network"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
